name: Verify MVP
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push replaces branch runs, but never interrupts a main deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare Rust reference verification
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup override set 1.96.0
      - run: npm ci
      - run: npm run verify

  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:cloudflare
      - run: npx wrangler d1 migrations apply lessdumb --local

  # Every push to main that passes both jobs goes live. Browser tests
  # (`npm run test:e2e`) are not part of CI for now; run them by hand.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, cloudflare]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Require the Cloudflare deploy token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret (Workers Scripts Edit + D1 Edit) to deploy main."
            exit 1
          fi
      - run: npm ci
      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply lessdumb --remote
      - name: Build and deploy the Worker
        run: npm run deploy:cloudflare
