name: Verify MVP
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push replaces branch runs, but never interrupts a main deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare Rust reference verification
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup override set 1.96.0
      - run: npm ci
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - name: Run browser integration tests
        env:
          BETTER_AUTH_URL: http://127.0.0.1:4323
          BETTER_AUTH_SECRET: ci-only-isolated-test-secret-at-least-32-characters
          LESSDUMB_DATA_DIR: /tmp/lessdumb-ci-data
          NODE_ENV: production
          PORT: 4323
          LESSDUMB_E2E_URL: http://127.0.0.1:4323
          # Email flows run against a loopback-only outbox; the Cloudflare job
          # below covers the default configuration with email off.
          LESSDUMB_TEST_OUTBOX: /tmp/lessdumb-ci-outbox
        run: |
          npm start > /tmp/lessdumb-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4323/ > /dev/null && break
            sleep 1
          done
          npm run test:e2e
      - name: Preserve failed browser traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare isolated Workers bindings before building
        run: |
          cat > .dev.vars <<'VARS'
          BETTER_AUTH_URL=http://127.0.0.1:4333
          BETTER_AUTH_SECRET=ci-worker-test-secret-at-least-32-characters
          VARS
      - run: npm run build:cloudflare
      - run: npx wrangler d1 migrations apply lessdumb --local
      - run: npx playwright install --with-deps chromium
      - name: Verify Workers runtime and D1 in the browser
        env:
          LESSDUMB_E2E_URL: http://127.0.0.1:4333
        run: npm run test:e2e -- --config playwright.cloudflare.config.ts
      - name: Preserve failed Workers browser traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cloudflare-browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Every push to main that passes both test jobs goes live.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, cloudflare]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Require the Cloudflare deploy token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret (Workers Scripts Edit + D1 Edit) to deploy main."
            exit 1
          fi
      - run: npm ci
      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply lessdumb --remote
      - name: Build and deploy the Worker
        run: npm run deploy:cloudflare
      - run: npx playwright install --with-deps chromium
      # Signs up a throwaway smoke+<run>@example.com account, saves progress to
      # the remote D1, opens a lesson, then deletes the account. A failure fails
      # the run (the new version is already live; fix forward or revert).
      - name: Smoke-test production
        timeout-minutes: 5
        env:
          LESSDUMB_E2E_URL: https://lessdumb.nicocerond.workers.dev
        run: npx playwright test --config playwright.smoke.config.ts
      - name: Preserve failed smoke-test screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
